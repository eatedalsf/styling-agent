# MkDocs Material configuration for the Wearly Intelligent Book.
#
# Builds the existing Markdown in book/, docs/, skills/, graph/, and
# the repo-root product docs into a navigable, searchable site at:
#   https://eatedalsf.github.io/styling-agent/
#
# Source files are NEVER moved. docs_dir is set to the repo root and
# the nav lists each file by its actual on-disk path, so the Markdown
# files stay alongside the code they document.

site_name: "Wearly — Intelligent Book"
site_description: "Evidence-informed, design-informed, user-preference-driven styling agent. Companion documentation for the Wearly prototype."
site_url: "https://eatedalsf.github.io/styling-agent/"
site_author: "Wearly project"

repo_url: "https://github.com/eatedalsf/styling-agent"
repo_name: "eatedalsf/styling-agent"
edit_uri: "edit/main/"

# MkDocs forbids `docs_dir` being the parent of the config file, so the
# Markdown source files are NOT consumed in place. Instead, `scripts/stage_docs.py`
# copies the canonical Markdown (book/, docs/, skills/, graph/, plus the
# repo-root product docs) into `_docs_build/` at build time. The originals
# never move — they stay alongside the code they document.
docs_dir: "_docs_build"
site_dir: "site"

theme:
  name: material
  language: en
  # Minimal white-on-white palette, inspired by altadaily.com — generous
  # whitespace, sans-serif typography, single restrained black accent.
  palette:
    - scheme: default
      primary: white
      accent: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: white
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: "DM Sans"
    code: "DM Mono"
  # Navigation: canonical Material left sidebar with collapsible /
  # expandable nested groups, matching the SEIS 666 course book.
  #
  # WHAT NOT TO ENABLE — and why:
  #   - navigation.tabs / navigation.tabs.sticky
  #     Adds horizontal tabs in the header strip. Makes the site
  #     read like a marketing nav, not a textbook.
  #   - navigation.sections
  #     Renders every top-level YAML section as a static label,
  #     NOT a collapsible group. Children show flat underneath.
  #   - navigation.expand
  #     Forces every group expanded all the time. Combined with
  #     `sections`, that's a 50+ line flat list.
  #
  # With NEITHER `sections` NOR `expand` enabled (and `tabs` off),
  # each YAML section becomes a clickable / collapsible header in
  # the left rail — the textbook-style nav the user asked for.
  features:
    - navigation.top             # "back to top" button
    - navigation.tracking        # update URL hash on section scroll
    - navigation.indexes         # section's first page acts as its index
    - navigation.footer          # prev / next links at the bottom
    - navigation.instant         # SPA-style fast page swaps
    - toc.follow                 # right-side TOC scrolls with content
    # NOT toc.integrate — that would move the TOC INTO the left
    # sidebar; we want the TOC in its own right column for in-page
    # navigation, separate from the cross-page sidebar.
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.action.edit

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      # Render Mermaid blocks as live diagrams instead of code blocks.
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eatedalsf/styling-agent
  generator: false  # hide the small "Made with Material for MkDocs" footer

# The nav lists every documentation file by its on-disk path. No moves.
#
# Note: "Home" maps to index.md (created by scripts/stage_docs.py from
# docs/home.md). That produces a real index.html at the site root.
# "The Book → Overview" still maps to book/index.md so the book's own
# table of contents stays the entry point for the book section.
nav:
  - Home: index.md

  - The Book — Part I · The Wearly Agent:
    - Overview: book/index.md
    - "01 · Product vision": book/01-vision.md
    - "02 · User problem": book/02-user-problem.md
    - "03 · Agent workflow": book/03-agent-workflow.md
    - "04 · Styling knowledge base": book/04-styling-knowledge-base.md
    - "05 · Wardrobe intelligence": book/05-wardrobe-intelligence.md
    - "06 · Fit-profile logic": book/06-fit-profile-logic.md
    - "07 · Calendar & weather context": book/07-calendar-weather-context.md
    - "08 · Shopping-gap logic": book/08-shopping-gap-logic.md
    - "09 · Before / after demo": book/09-before-after-demo.md
    - "10 · Privacy & security": book/10-privacy-security.md
    - "11 · Product roadmap": book/11-product-roadmap.md

  - The Book — Part II · Styling Rule Reference:
    - "S1 · Color and skin tone": book/S1-color-and-skin-tone.md
    - "S2 · Silhouette and fit": book/S2-silhouette-and-fit.md
    - "S3 · Occasion and context": book/S3-occasion-and-context.md
    - "S4 · Weather and layering": book/S4-weather-and-layering.md
    - "S5 · Wardrobe construction": book/S5-wardrobe-construction.md
    - "S6 · Rotation and freshness": book/S6-rotation-and-freshness.md
    - "S7 · Honest gaps": book/S7-honest-gaps.md
    - "S8 · Body-positive framing": book/S8-body-positive-framing.md

  - The Book — Part III · Evidence & provenance:
    - "12 · Evidence & references": book/12-evidence-and-references.md

  - Reference:
    - "Glossary": docs/glossary.md
    - "FAQ": docs/faq.md
    - "References (bibliography)": docs/references.md
    - "Audit · book ↔ app (May 2026)": docs/audit-2026-05.md

  - Evidence:
    - "Evidence & references (canonical)": docs/evidence-and-references.md

  - Skills:
    - "Skill package overview": skills/wearly-styling-agent/SKILL.md
    - "Occasion rules": skills/wearly-styling-agent/occasion-rules.md
    - "Weather rules": skills/wearly-styling-agent/weather-rules.md
    - "Fit & silhouette rules": skills/wearly-styling-agent/fit-silhouette-rules.md
    - "Wardrobe filtering rules": skills/wearly-styling-agent/wardrobe-filtering-rules.md
    - "Color coordination rules": skills/wearly-styling-agent/color-coordination-rules.md
    - "Wear history rules": skills/wearly-styling-agent/wear-history-rules.md
    - "Shopping gap rules": skills/wearly-styling-agent/shopping-gap-rules.md
