# Wearly AI — Streamlit configuration
# Picked up automatically by `streamlit run app.py` and by Streamlit
# Community Cloud on deployment.

[theme]
# Clean-luxury palette matching the in-app CSS:
#   paper  = #F5F0EB (ivory)
#   ink    = #1C1917 (deep charcoal)
#   accent = #C17F5A (warm terracotta)
#   warm   = #FDFAF7 (card surface)
base = "light"
primaryColor = "#C17F5A"
backgroundColor = "#F5F0EB"
secondaryBackgroundColor = "#FDFAF7"
textColor = "#1C1917"
font = "sans serif"

[server]
# Required for Streamlit Community Cloud / containerized hosting.
headless = true
# Allow embedding the demo in docs or a portfolio page later.
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# Hide the "Made with Streamlit" footer for a cleaner product feel.
# (toolbarMode also affects the top-right hamburger; keep it visible
# so reviewers can inspect / rerun.)
toolbarMode = "minimal"
