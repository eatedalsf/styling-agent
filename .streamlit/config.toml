# Wearly — Streamlit configuration
# Picked up automatically by `streamlit run app.py` and by Streamlit
# Community Cloud on deployment.

[theme]
# Minimal white-on-white palette (Alta-inspired). Matches the in-app CSS:
#   page bg   = #FFFFFF (pure white)
#   cards     = #FFFFFF (pure white, separated by #EEEEEE rules)
#   primary   = #111111 (matte black — used by form_submit buttons and
#                        any Streamlit-themed primary action)
#   text      = #111111
#   secondary background (for chips, sidebar widgets, etc.) = #FAFAFA
base = "light"
primaryColor = "#111111"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAFAFA"
textColor = "#111111"
font = "sans serif"

[server]
# Required for Streamlit Community Cloud / containerized hosting.
headless = true
# Allow embedding the demo in docs or a portfolio page later.
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
# Hide the "Made with Streamlit" footer for a cleaner product feel.
toolbarMode = "minimal"
