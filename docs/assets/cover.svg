<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Wearly — an Intelligent Book on Personal Styling Agents">
  <!-- Background: pure white, Alta-inspired -->
  <rect width="1600" height="900" fill="#FFFFFF"/>

  <!-- Top label: course + semester -->
  <text x="800" y="200" text-anchor="middle"
        font-family="'DM Sans','Inter','Helvetica Neue',system-ui,sans-serif"
        font-size="16" font-weight="600" letter-spacing="8" fill="#9C9C9C">
    SEIS 666  ·  SPRING 2026
  </text>

  <!-- Wordmark -->
  <text x="800" y="430" text-anchor="middle"
        font-family="'DM Serif Display','Times New Roman',serif"
        font-size="180" font-weight="400" letter-spacing="6" fill="#111111">
    Wearly
  </text>

  <!-- Thin horizontal rule -->
  <line x1="640" y1="500" x2="960" y2="500" stroke="#111111" stroke-width="1"/>

  <!-- Subtitle -->
  <text x="800" y="560" text-anchor="middle"
        font-family="'DM Sans','Inter','Helvetica Neue',system-ui,sans-serif"
        font-size="28" font-weight="400" letter-spacing="2" fill="#2E2E2E">
    An Intelligent Book on Personal Styling Agents
  </text>

  <!-- Tagline -->
  <text x="800" y="612" text-anchor="middle"
        font-family="'DM Sans','Inter','Helvetica Neue',system-ui,sans-serif"
        font-size="17" font-weight="400" letter-spacing="0.4" fill="#6B6B6B">
    evidence-informed  ·  design-informed  ·  user-preference-driven
  </text>

  <!-- Footer institution line -->
  <text x="800" y="780" text-anchor="middle"
        font-family="'DM Sans','Inter','Helvetica Neue',system-ui,sans-serif"
        font-size="13" font-weight="500" letter-spacing="5" fill="#9C9C9C">
    UNIVERSITY OF ST. THOMAS
  </text>

  <!-- Small mark in the corner -->
  <g transform="translate(75, 75)">
    <circle cx="0" cy="0" r="14" fill="#111111"/>
    <text x="0" y="5" text-anchor="middle"
          font-family="'DM Serif Display',serif" font-size="16" font-weight="400" fill="#FFFFFF">W</text>
  </g>
</svg>
