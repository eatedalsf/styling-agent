name: tests

on:
  push:
    branches: [ "main", "claude/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate JSON data files
        # Per-user state files (calendar_events.json, wear_history.json,
        # wishlist.json, user_profile.json, …) are gitignored — they
        # exist only on a running app. CI validates the committed
        # seeds + canonical rule/graph data.
        run: |
          for f in wardrobe.json \
                   seed_calendar_events.json \
                   seed_wear_history.json \
                   color_rules.json \
                   graph/graph.json \
                   graph/learning-graph.json; do
            python -c "import json; json.load(open('$f')); print('OK', '$f')" || exit 1
          done

      - name: Validate app.py and main.py parse
        run: |
          python -c "import ast; ast.parse(open('app.py').read()); print('app.py OK')"
          python -c "import ast; ast.parse(open('main.py').read()); print('main.py OK')"
          python -c "import ast; ast.parse(open('styling_agent.py').read()); print('styling_agent.py OK')"

      - name: Run smoke tests (stdlib unittest)
        run: python -m unittest discover -s tests -v
